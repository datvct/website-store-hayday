services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hayday
      POSTGRES_USER: hayday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hayday_dev_password}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayday -d hayday"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      DATABASE_URL: postgres://hayday:${POSTGRES_PASSWORD:-hayday_dev_password}@db:5432/hayday?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SHOP_NAME: ${SHOP_NAME:-Hay Day Order}
      BANK_CODE: ${BANK_CODE:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      MOMO_PHONE: ${MOMO_PHONE:-}
      MOMO_ACCOUNT_NAME: ${MOMO_ACCOUNT_NAME:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      SEED_PRODUCTS_FILE: /app/seeds/products.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
