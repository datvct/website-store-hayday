services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hayday
      POSTGRES_USER: hayday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hayday_dev_password}
    ports:
      - "0.0.0.0:5433:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayday -d hayday"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      DATABASE_URL: postgres://hayday:${POSTGRES_PASSWORD:-hayday_dev_password}@db:5432/hayday?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # Backend runs inside Docker, so use the internal MinIO service name.
      # MinIO is intentionally not published to the host in this deployment.
      IMAGE_STORAGE_BASE_URL: http://minio:9000/hayday-images
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-hayday_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-hayday_minio_password}
      S3_BUCKET: ${S3_BUCKET:-hayday-images}
      SHOP_NAME: ${SHOP_NAME:-Hay Day Order}
      BANK_CODE: ${BANK_CODE:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      MOMO_PHONE: ${MOMO_PHONE:-}
      MOMO_ACCOUNT_NAME: ${MOMO_ACCOUNT_NAME:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SEED_PRODUCTS_FILE: /app/seeds/products.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-hayday_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-hayday_minio_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  minio_data:
